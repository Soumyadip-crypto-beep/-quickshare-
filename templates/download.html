<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Download – QuickShare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 40px 36px; text-align: center; max-width: 400px; width: 100%; }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h2 { color: #2d3748; margin-bottom: 8px; }
    p { color: #718096; font-size: 0.95rem; margin-bottom: 24px; word-break: break-all; }
    a.btn { display: inline-block; padding: 12px 32px; background: #667eea; color: white; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 1rem; transition: background 0.2s; }
    a.btn:hover { background: #5a67d8; }
    a.back { display: block; margin-top: 16px; color: #a0aec0; font-size: 0.85rem; text-decoration: none; }
    a.back:hover { color: #667eea; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h2>File Ready</h2>
    <p>{{ filename }}</p>
    <a class="btn" href="{{ download_url }}">⬇ Download</a>
    <a class="back" href="/">← Back to QuickShare</a>
  </div>
</body>
</html>
